<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#eee;font-family:system-ui,sans-serif;padding:24px}
h1{font-size:1.4rem;margin-bottom:8px;color:#fff}
p.sub{color:#666;font-size:.85rem;margin-bottom:32px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:32px}
.card{background:#111;border:1px solid #222;border-radius:12px;padding:20px}
.card h2{font-size:.9rem;color:#888;margin-bottom:16px;text-transform:uppercase;letter-spacing:.05em}
canvas{width:100%!important}
.list{max-height:320px;overflow-y:auto}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #1a1a1a}
.row:last-child{border-bottom:none}
a{color:#c084fc;text-decoration:none}
a:hover{color:#e879f9}
.bar{height:6px;background:#c084fc;border-radius:3px;margin-top:4px}
.username{font-size:.85rem}
.count{font-size:.75rem;color:#666}
.month-list{max-height:200px;overflow-y:auto;margin-top:12px}
.month-row{padding:6px 0;border-bottom:1px solid #1a1a1a;font-size:.8rem}
.month-label{color:#888}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:2px 8px;font-size:.75rem}
.chip a{color:#c084fc}
input{width:100%;padding:8px 12px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#eee;font-size:.85rem;margin-bottom:12px;outline:none}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
