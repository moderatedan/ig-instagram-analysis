const w = window.innerWidth, h = window.innerHeight;
const svg = d3.select('#graph').attr('width',w).attr('height',h);
const g = svg.append('g');

svg.call(d3.zoom().scaleExtent([0.1,8]).on('zoom', e => g.attr('transform', e.transform)));

const color = n => {
  if (n.type==='self') return '#c084fc';
  if (n.type==='mutual') return '#818cf8';
  if (n.type==='follower') return '#38bdf8';
  return '#fb923c';
};

const sim = d3.forceSimulation(graph.nodes)
  .force('link', d3.forceLink(graph.links).id(d=>d.id).distance(d => d.type==='engagement' ? 80 + (1/(d.value||1))*2000 : 120).strength(0.3))
  .force('charge', d3.forceManyBody().strength(-60))
  .force('center', d3.forceCenter(w/2, h/2))
  .force('collision', d3.forceCollide().radius(d => d.size + 2));

const link = g.append('g').selectAll('line').data(graph.links).join('line')
  .attr('stroke', d => d.type==='engagement' ? '#fb923c33' : '#38bdf822')
  .attr('stroke-width', 0.5);

const node = g.append('g').selectAll('circle').data(graph.nodes).join('circle')
  .attr('r', d => d.size || 4)
  .attr('fill', d => color(d))
  .attr('opacity', d => d.type==='self' ? 1 : 0.75)
  .style('cursor','pointer')
  .call(d3.drag()
    .on('start', (e,d) => { if(!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on('drag', (e,d) => { d.fx=e.x; d.fy=e.y; })
    .on('end', (e,d) => { if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }))
  .on('mouseover', (e,d) => {
    const tt = document.getElementById('tooltip');
    tt.style.display='block';
    tt.style.left=(e.clientX+12)+'px';
    tt.style.top=(e.clientY-10)+'px';
    tt.innerHTML = d.type==='self' ? '<b>@dan__brummitt</b>' :
      `<a href="https://instagram.com/${d.id}" target="_blank">@${d.id}</a><br>
       ${d.date ? 'Followed: '+d.date+'<br>' : ''}
       ${d.score ? 'Story likes: '+d.score : ''}`;
  })
  .on('mouseout', () => document.getElementById('tooltip').style.display='none')
  .on('click', (e,d) => { if(d.type!=='self') window.open('https://instagram.com/'+d.id,'_blank'); });

sim.on('tick', () => {
  link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
  node.attr('cx',d=>d.x).attr('cy',d=>d.y);
});
